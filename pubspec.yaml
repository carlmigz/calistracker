name: calistracker
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  firebase_analytics: ^12.0.4
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  get: ^4.7.2
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  ionicons: ^0.2.2
  lottie: ^3.3.1
  permission_handler: ^12.0.1
  rxdart: any
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  toastification: ^3.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Ethnocentric
      fonts:
        - asset: assets/fonts/Ethnocentric-Regular.otf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#ffffff"
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

