name: calistracker
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Navigation
  go_router: ^16.2.4

  # Networking & storage
  dio: ^5.9.0
  shared_preferences: ^2.5.3

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  lottie: ^3.3.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  toastification: ^3.0.3

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
  
    - assets/icons/
    - assets/images/
    - assets/data/

  fonts:
    - family: Ethnocentric
      fonts:
        - asset: assets/fonts/Ethnocentric-Regular.otf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#ffffff"
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

